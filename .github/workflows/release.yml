name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag and manifest versions match
        run: node -e "const manifest=require('./manifest.json'); if(manifest.version !== process.env.GITHUB_REF_NAME) { throw new Error('Tag ' + process.env.GITHUB_REF_NAME + ' does not match manifest ' + manifest.version); }"

      - name: Build and verify
        run: |
          npm run build
          npm test
          npm run lint

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          release_title="$GITHUB_REF_NAME"
          if [[ -s RELEASE_NOTES.md ]]; then
            notes_title="$(sed -n '1s/^# //p' RELEASE_NOTES.md)"
            if [[ -n "$notes_title" ]]; then
              release_title="$notes_title"
            fi
          fi

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            if [[ -s RELEASE_NOTES.md ]]; then
              gh release edit "$GITHUB_REF_NAME" \
                --title "$release_title" \
                --notes-file RELEASE_NOTES.md
            else
              gh release edit "$GITHUB_REF_NAME" --title "$release_title"
            fi
          elif [[ -s RELEASE_NOTES.md ]]; then
            gh release create "$GITHUB_REF_NAME" \
              --title "$release_title" \
              --notes-file RELEASE_NOTES.md
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$release_title" \
              --generate-notes
          fi

          gh release upload "$GITHUB_REF_NAME" \
            main.js manifest.json styles.css \
            --clobber
