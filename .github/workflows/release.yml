name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag and manifest versions match
        run: node -e "const manifest=require('./manifest.json'); if(manifest.version !== process.env.GITHUB_REF_NAME) { throw new Error('Tag ' + process.env.GITHUB_REF_NAME + ' does not match manifest ' + manifest.version); }"

      - name: Build and verify
        run: |
          npm run build
          npm test
          npm run lint

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TITLE="$(sed -n '1s/^# //p' RELEASE_NOTES.md)"
          gh release create "$GITHUB_REF_NAME" \
            main.js manifest.json styles.css \
            --title "$RELEASE_TITLE" \
            --notes-file RELEASE_NOTES.md
